[project]
name = "mojo-dtaidistance"
version = "0.1.0"
description = "DTW distance and clustering kernels implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "dtw", "time-series", "clustering"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "dtaidistance", "pyclustering"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-dtaidistance"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
